<section class="card">
  <div class="card-body">
    @if (responder.responderId) {
      <h1 class="h4">{{ responder.name }}</h1>
      <p class="text-muted">{{ responder.type }} · {{ responder.stationLocation }}</p>
      <p>Duty status <strong>{{ status.replaceAll('_', ' ') | titlecase }}</strong></p>
      <div class="d-flex gap-2 flex-wrap">
        @if (responder.incidentId) {
          <button class="btn btn-outline-primary" type="button" (click)="setStatus('ON_ROUTE')"
            [disabled]="statusPending || status !== 'ASSIGNED'">Mark on route</button>
          <button class="btn btn-outline-primary" type="button" (click)="setStatus('ON_SCENE')"
            [disabled]="statusPending || status !== 'ON_ROUTE'">Mark on scene</button>
        }
        <button class="btn btn-outline-primary" type="button" (click)="setStatus('AVAILABLE')"
          [disabled]="statusPending || status === 'AVAILABLE'">{{ responder.incidentId ? 'Release assignment' : 'Go available' }}</button>
        <button class="btn btn-outline-secondary" type="button" (click)="setStatus('OFF_DUTY')"
          [disabled]="statusPending || !!responder.incidentId || status === 'OFF_DUTY'">Go off duty</button>
      </div>
    }
    @if (statusError) { <p class="alert alert-warning mt-3" role="alert">{{ statusError }}</p> }
    <button class="btn btn-link px-0" type="button" (click)="logout()">Sign out</button>
  </div>
</section>
