<header class="platform-header">
  <div class="platform-header-inner">
    <h1>Emergency Response Platform</h1>
    <a mat-stroked-button routerLink="/login">Staff sign-in</a>
  </div>
</header>

<main class="public-actions">
  <section class="card shadow-sm">
    <div class="card-body p-4">
      <h2 class="h4">Report an emergency</h2>
      <p class="text-muted">For immediate help in India, <a href="tel:112">call 112</a>. Reports here are separate from the official emergency service.</p>
      <div class="action-buttons">
        <button mat-flat-button type="button" (click)="openIncidentReportModal()">Report an incident</button>
        <button class="btn btn-danger" type="button" (click)="sendSOSAlert()" [disabled]="submissionPending">
          {{ submissionPending ? 'Sending SOS…' : 'Send SOS from my location' }}
        </button>
      </div>
      @if (submissionError) {
        <div class="alert alert-warning mt-3 mb-0" role="alert">{{ submissionError }}</div>
      }
    </div>
  </section>
</main>
