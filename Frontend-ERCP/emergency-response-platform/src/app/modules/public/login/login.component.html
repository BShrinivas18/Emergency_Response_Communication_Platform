<main class="login-page">
  <section class="card shadow-sm">
    <div class="card-body p-4">
      <a routerLink="/">Emergency Response Platform</a>
      <h1 class="h3 mt-3 mb-3">Staff sign-in</h1>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" formControlName="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" formControlName="password" type="password" autocomplete="current-password" required>
        </div>
        @if (sessionExpired && !loginError) {
          <p class="alert alert-info" role="status">Your session ended. Sign in again.</p>
        }
        @if (loginError) {
          <p class="alert alert-danger" role="alert">{{ loginError }}</p>
        }
        <button mat-flat-button type="submit" [disabled]="loginForm.invalid || pending">
          {{ pending ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
      <p class="form-text mt-3 mb-0">For account access or password help, contact your organization’s platform administrator.</p>
    </div>
  </section>
</main>
