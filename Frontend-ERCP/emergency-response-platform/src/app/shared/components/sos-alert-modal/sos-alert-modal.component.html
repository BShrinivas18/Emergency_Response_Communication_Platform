<h2 mat-dialog-title>Incident recorded</h2>
<mat-dialog-content>
  <div class="alert alert-success" role="status">Report reference <strong>#{{ data.incident.incidentId }}</strong></div>
  <p>Responder assignment has yet to be confirmed.</p>
  <a href="tel:112">Call 112 in India for immediate help</a>
</mat-dialog-content>
<mat-dialog-actions align="end"><button mat-flat-button (click)="dialogRef.close()">Done</button></mat-dialog-actions>
