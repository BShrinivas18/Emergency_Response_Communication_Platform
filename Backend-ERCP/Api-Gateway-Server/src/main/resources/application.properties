spring.application.name=Api-Gateway-Server
server.port=8888
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${RDS_PASSWORD}

##if table is not present it creates or else updates
spring.jpa.hibernate.ddl-auto=update

## Optional Properties
spring.jpa.show-sql=false


# Local-only boundary; service authentication is required before multi-host deployment.
server.address=127.0.0.1
eureka.instance.ip-address=127.0.0.1
security.jwt.secret=${JWT_SECRET}
security.cors.origins=${CORS_ORIGINS:http://localhost:4200}
